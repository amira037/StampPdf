<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 도장 삽입기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f7f8f9;
  --border: #d8dde2;
  --border-strong: #aeb8c2;
  --text: #15191d;
  --muted: #69727d;
  --accent: #c8372b;
  --accent-soft: #fff0ee;
  --focus: #2878d8;
  --stamp: #2d7b56;
  --radius: 8px;
}

html, body {
  height: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  flex-shrink: 0;
  height: 52px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.logo {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}

header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }

.doc-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--muted);
}

.toolbar {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.tool-group { display: flex; gap: 5px; }

.toolbar .outline-btn {
  width: auto;
  min-height: 30px;
  margin-top: 0;
  padding: 0 11px;
  font-size: 12px;
}

.toolbar .primary-btn {
  width: auto;
  min-height: 32px;
  padding: 0 16px;
}

/* 오른쪽 패널이 숨겨지는 좁은 화면에서만 보인다 */
.stamp-count {
  display: none;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 260px minmax(320px, 1fr) 176px;
}

.sidebar,
.thumb-panel {
  background: var(--surface);
  overflow: auto;
  padding: 14px;
}

.sidebar {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.thumb-panel {
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
}

.thumb-panel .thumb-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
}

.placed-section {
  flex-shrink: 0;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.sec-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}

.drop-zone {
  position: relative;
  min-height: 78px;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  color: var(--muted);
  background: var(--surface-2);
  transition: border-color 0.16s, background 0.16s, color 0.16s;
  line-height: 1.5;
}

.drop-zone input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

body.dragging-file .drop-zone input[type=file] { pointer-events: none; }

.drop-zone:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.drop-zone.filled {
  border-style: solid;
  background: #fbfbfc;
  color: var(--text);
  word-break: break-all;
}

.dz-icon { font-size: 20px; margin-bottom: 3px; }
.dz-hint { font-size: 10px; color: var(--muted); }

.tabs { display: flex; gap: 5px; margin-bottom: 8px; }
.tab,
.sbtn,
.icon-btn,
.outline-btn,
.primary-btn {
  font-family: inherit;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
}

.tab {
  flex: 1;
  min-height: 30px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
}

.tab.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}

.panel { display: none; }
.panel.on { display: block; }

.frow,
.srow { margin-bottom: 10px; }

.frow label,
.srow-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 11px;
}

.frow input[type=text] {
  width: 100%;
  height: 32px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  font: inherit;
  background: var(--surface);
}

.frow input[type=text]:focus { border-color: var(--focus); }
.frow input[type=color] {
  width: 100%;
  height: 32px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
}

.shape-btns { display: flex; gap: 5px; }
.sbtn {
  flex: 1;
  min-height: 28px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 10px;
}

.sbtn.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

input[type=range] { width: 100%; accent-color: var(--accent); }

.stamp-thumb {
  min-height: 92px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: grab;
}

.stamp-thumb:active { cursor: grabbing; }

.stamp-thumb img {
  max-width: 84px;
  max-height: 84px;
  object-fit: contain;
}

.no-stamp { color: var(--muted); font-size: 11px; }

.preset-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.preset {
  position: relative;
  height: 64px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  overflow: hidden;
}

.preset:active { cursor: grabbing; }
.preset.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(200,55,43,0.15);
}

.preset img {
  max-width: 54px;
  max-height: 54px;
  object-fit: contain;
  pointer-events: none;
}

.preset .x {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: rgba(200,55,43,0.88);
  color: #fff;
  font-size: 12px;
  line-height: 18px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}

.preset-list.editing .preset .x { opacity: 1; pointer-events: auto; }
.preset-list.editing .preset { outline: 1.5px dashed var(--border-strong); }
.preset-list.editing .preset.selected { outline-color: var(--accent); }

.preset-edit-btn {
  font-family: inherit;
  font-size: 10px;
  padding: 2px 8px;
  height: 22px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.preset-edit-btn.on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.52);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px;
  min-width: 300px;
  max-width: 92vw;
  box-shadow: 0 12px 48px rgba(0,0,0,0.32);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.modal-title { font-size: 14px; font-weight: 700; }
.modal-close {
  width: 26px;
  height: 26px;
  border: none;
  background: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--muted);
  border-radius: 5px;
  line-height: 1;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.crop-hint { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.crop-area {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-conic-gradient(#e0e3e7 0% 25%, #fff 0% 50%) 0 0 / 14px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  cursor: crosshair;
}
#crop-canvas { display: block; max-width: 100%; }
.modal-footer {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  justify-content: flex-end;
}
.crop-cancel-btn, .crop-confirm-btn {
  padding: 7px 16px;
  border-radius: 6px;
  font: inherit;
  cursor: pointer;
  font-size: 12px;
}
.crop-cancel-btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
}
.crop-cancel-btn:hover { border-color: var(--border-strong); color: var(--text); }
.crop-confirm-btn {
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}
.crop-confirm-btn:hover { background: #a92f26; }
.empty-list { color: var(--muted); font-size: 11px; line-height: 1.6; }

.outline-btn {
  width: 100%;
  min-height: 32px;
  padding: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
}

.outline-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.outline-btn:disabled,
.primary-btn:disabled,
.icon-btn:disabled { opacity: 0.35; cursor: default; }

.primary-btn {
  width: 100%;
  min-height: 38px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.primary-btn:hover:not(:disabled) { background: #a92f26; }

.danger-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.bg-opts {
  display: none;
  padding: 9px;
  margin-top: 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
}

.bg-opts.visible { display: block; }

.page-nav {
  display: flex;
  align-items: center;
  gap: 5px;
}

.page-nav[hidden],
.enhance[hidden] { display: none; }

.enhance {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.enhance select {
  min-height: 30px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
}

.icon-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
}

.page-nav span {
  min-width: 48px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

.stamp-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 138px;
  overflow: auto;
}

.stamp-row {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 32px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.stamp-row.selected {
  color: var(--text);
  border-color: var(--stamp);
  background: #eef8f3;
}

.stamp-row img {
  width: 22px;
  height: 22px;
  object-fit: contain;
}

.viewer {
  position: relative;
  min-width: 0;
  overflow: auto;
  padding: 24px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(0deg, rgba(0,0,0,0.035) 1px, transparent 1px),
    var(--bg);
  background-size: 22px 22px;
}

.viewer.stamp-target {
  outline: 2px solid var(--focus);
  outline-offset: -8px;
}

.empty-state {
  width: 100%;
  height: 100%;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
}

.empty-state .ei { font-size: 42px; opacity: 0.45; }
.empty-state p { font-size: 13px; }

#canvas-wrap {
  position: relative;
  display: none;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 5px 24px rgba(21,25,29,0.18);
}

#pdf-canvas { display: block; }

.placed-stamp,
.ghost {
  position: absolute;
  user-select: none;
  touch-action: none;
}

.placed-stamp {
  cursor: move;
  border: 1px solid transparent;
}

.placed-stamp.selected {
  border-color: var(--stamp);
  box-shadow: 0 0 0 2px rgba(45,123,86,0.18);
}

.placed-stamp img,
.ghost img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  pointer-events: none;
}

.placed-stamp .resize-handle { display: none; }
.placed-stamp.selected .resize-handle { display: block; }

.ghost {
  display: none;
  cursor: move;
  border: 1px dashed var(--focus);
  background: rgba(40,120,216,0.06);
  z-index: 5;
}

.ghost.visible { display: block; }

.resize-handle {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 13px;
  height: 13px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--focus);
  cursor: nwse-resize;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

.thumb-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.page-thumb {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px;
  background: var(--surface-2);
  cursor: pointer;
}

.page-thumb.active {
  border-color: var(--focus);
  box-shadow: 0 0 0 2px rgba(40,120,216,0.16);
}

.page-thumb canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
  border: 1px solid #edf0f2;
}

.page-thumb .num {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.page-thumb.has-stamps::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--surface-2);
}

.global-drop {
  position: fixed;
  inset: 0;
  display: none;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  padding: 12px;
  background: rgba(238,241,243,0.95);
  z-index: 800;
  pointer-events: none;
}

body.dragging-file .global-drop { display: grid; }

.drop-target {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 2px dashed var(--border-strong);
  border-radius: 12px;
  background: rgba(255,255,255,0.6);
  color: var(--muted);
  text-align: center;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}

.drop-target strong { font-size: 17px; }
.drop-target span { font-size: 12px; }
.drop-target.suggested { border-color: var(--focus); color: var(--text); }
.drop-target.hover { border-style: solid; border-color: var(--focus); background: rgba(40,120,216,0.1); color: var(--focus); }
.drop-target.blocked { opacity: 0.4; }

#snack {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 900;
  transform: translateX(-50%) translateY(70px);
  min-width: 170px;
  max-width: min(520px, calc(100vw - 32px));
  padding: 9px 16px;
  border-radius: 999px;
  background: #15191d;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
  transition: transform 0.25s;
  pointer-events: none;
}

#snack.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 980px) {
  .layout { grid-template-columns: 230px minmax(280px, 1fr); }
  .thumb-panel { display: none; }
  .doc-name { display: none; }
  .stamp-count:not([hidden]) { display: inline; }
}

@media (max-width: 720px) {
  header { padding: 0 12px; }
  .enhance span { display: none; }
  header h1 { display: none; }
  .toolbar { gap: 6px; }
  .toolbar .outline-btn { padding: 0 8px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">印</div>
  <h1>도장 삽입기</h1>
  <span class="doc-name" id="doc-name"></span>
  <div class="toolbar">
    <label class="enhance" id="enhance" hidden>
      <span>보정</span>
      <select id="enhance-select">
        <option value="scan">스캔처럼</option>
        <option value="bw">흑백 스캔</option>
        <option value="original">원본</option>
      </select>
    </label>
    <div class="page-nav" id="page-nav" hidden>
      <button class="icon-btn" id="prev-btn" disabled title="이전 페이지">‹</button>
      <span id="page-info">- / -</span>
      <button class="icon-btn" id="next-btn" disabled title="다음 페이지">›</button>
    </div>
    <span class="stamp-count" id="stamp-count" hidden></span>
    <div class="tool-group">
      <button class="outline-btn" id="copy-btn" disabled>복사</button>
      <button class="outline-btn" id="paste-btn" disabled>붙여넣기</button>
      <button class="outline-btn danger-btn" id="delete-btn" disabled>삭제</button>
    </div>
    <div class="tool-group">
      <button class="outline-btn" id="save-jpg-btn" disabled title="페이지마다 JPG 한 장, 여러 페이지면 ZIP으로 묶습니다">JPG로 저장</button>
      <button class="primary-btn" id="save-btn" disabled>PDF로 저장</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <section>
      <div class="sec-label">문서 (PDF·JPG)</div>
      <div class="drop-zone" id="pdf-zone">
        <input type="file" accept=".pdf,application/pdf,image/*" id="pdf-input" multiple>
        <span class="dz-icon">DOC</span>
        <span id="pdf-zone-txt">클릭 또는 드래그하여 열기</span>
        <span class="dz-hint">여러 장을 고르면 페이지로 이어 붙입니다</span>
      </div>
    </section>

    <section>
      <div class="sec-label">도장 만들기</div>
      <div class="tabs">
        <button class="tab on" id="t-upload">이미지</button>
        <button class="tab" id="t-design">직접 만들기</button>
      </div>

      <div class="panel on" id="p-upload">
        <div class="drop-zone" id="stamp-zone">
          <input type="file" accept="image/*" id="stamp-input">
          <span class="dz-icon">IMG</span>
          <span id="stamp-zone-txt">클릭 또는 드래그하여 등록</span>
          <span class="dz-hint">PNG, JPG, WEBP</span>
        </div>
      </div>

      <div class="panel" id="p-design">
        <div class="frow">
          <label for="stamp-text">텍스트</label>
          <input type="text" id="stamp-text" value="승인" maxlength="6">
        </div>
        <div class="frow">
          <label for="stamp-color">색상</label>
          <input type="color" id="stamp-color" value="#cc2222">
        </div>
        <div class="frow">
          <label>모양</label>
          <div class="shape-btns">
            <button class="sbtn on" data-shape="circle">원형</button>
            <button class="sbtn" data-shape="rect">사각</button>

function wireGlobalDrop() {
  const targets = Array.from(els.globalDrop.querySelectorAll('.drop-target'));
  const docTarget = targets.find(t => t.dataset.target === 'doc');
  const stampTarget = targets.find(t => t.dataset.target === 'stamp');

  window.addEventListener('dragover', e => {
    e.preventDefault();
    if (!Array.from(e.dataTransfer.types).includes('Files')) return;
    if (!document.body.classList.contains('dragging-file')) {
      document.body.classList.add('dragging-file');
      showDropSuggestion(e.dataTransfer.items);
    }
    const hit = dropTargetAt(e.clientX, e.clientY);
    targets.forEach(t => t.classList.toggle('hover', t.dataset.target === hit && !t.classList.contains('blocked')));
  });
  window.addEventListener('dragleave', e => {
    if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
      endFileDrag();
    }
  });
  window.addEventListener('drop', e => {
    const isFileDrag = document.body.classList.contains('dragging-file');
    // 오버레이를 숨기기 전에 위치를 판정해야 칸 크기가 남아 있다
    const target = isFileDrag && dropTargetAt(e.clientX, e.clientY);
    endFileDrag();
    const files = Array.from(e.dataTransfer.files);
    if (!isFileDrag || !files.length) return;
    e.preventDefault();
    if (target === 'stamp') loadStampFiles(files);
    else openDocumentFiles(files);
  });

  // 드래그 중에는 브라우저가 파일 형식만 알려준다. 형식으로 어느 칸이 맞을지 미리 표시한다.
  function showDropSuggestion(items) {
    const types = Array.from(items || []).filter(i => i.kind === 'file').map(i => i.type);
    const hasPdf = types.some(t => t === 'application/pdf');
    const looksLikeStamp = types.length === 1 && /^image\/(png|webp|gif|svg)/.test(types[0]);
    docTarget.querySelector('span').textContent = pdfDoc && !hasPdf
      ? '열린 문서 뒤에 페이지로 추가'
      : (types.length > 1 ? types.length + '개 파일을 한 문서로 묶어 열기' : 'PDF · JPG · PNG');
    stampTarget.querySelector('span').textContent = hasPdf ? 'PDF는 도장으로 쓸 수 없습니다' : '프리셋에 추가됩니다';
    stampTarget.classList.toggle('blocked', hasPdf);
    docTarget.classList.toggle('suggested', !looksLikeStamp);
    stampTarget.classList.toggle('suggested', looksLikeStamp);
  }

  function dropTargetAt(x, y) {
    const r = stampTarget.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom ? 'stamp' : 'doc';
  }

  function endFileDrag() {
    document.body.classList.remove('dragging-file');
    targets.forEach(t => t.classList.remove('hover'));
  }

  els.viewer.addEventListener('dragover', e => {
    if (!pdfDoc) return;
    const dataUrl = getDraggedStamp(e);
    if (!dataUrl && !currentStampUrl) return;
    e.preventDefault();
    els.viewer.classList.add('stamp-target');
  });
  els.viewer.addEventListener('dragleave', () => els.viewer.classList.remove('stamp-target'));
  els.viewer.addEventListener('drop', e => {
    const dataUrl = getDraggedStamp(e) || currentStampUrl;
    if (!pdfDoc || !dataUrl || e.dataTransfer.files.length) return;
    e.preventDefault();
    e.stopPropagation();
    els.viewer.classList.remove('stamp-target');
    const point = eventToCanvasPoint(e);
    if (!point) return;
    selectStamp(dataUrl, selectedPresetId);
    addStampAtCanvasPoint(dataUrl, point.x, point.y);
  });
}

function wireStampControls() {

  els.deleteBtn.addEventListener('click', deleteSelectedStamp);
  els.copyBtn.addEventListener('click', copySelectedStamp);

    const key = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && key === 'c') {
      copySelectedStamp();

      pasteCopiedStamp();

function wirePageControls() {

    const maxY = els.viewer.scrollHeight - els.viewer.clientHeight;
    if (maxY <= 4) return;
    if (els.viewer.scrollTop >= maxY - 4 && curPage < totalPages) {
      flipByScroll(curPage + 1, 'top');

function wireGhost() {
  els.canvasWrap.addEventListener('click', e => {
    if (e.target.closest('.placed-stamp') || e.target.closest('.ghost')) return;
    selectedStampId = null;
    renderPlacedStamps();
    renderStampList();
    updateButtons();
  });

  document.addEventListener('pointermove', e => {
    if (!placedDrag && !placedResize) return;
    const stamp = getSelectedStamp();
    if (!stamp) return;
    if (placedDrag) {
      const dx = (e.clientX - placedDrag.startX) / canvasScale;
      const dy = (e.clientY - placedDrag.startY) / canvasScale;
      stamp.x = placedDrag.x + dx;
      stamp.y = placedDrag.y + dy;
    } else if (placedResize) {
      const dx = (e.clientX - placedResize.startX) / canvasScale;
      const aspect = placedResize.width / placedResize.height;
      const next = Math.max(30 / canvasScale, placedResize.width + dx);
      stamp.width = next;
      stamp.height = next / aspect;
    }
    clampStampToPage(stamp);
    renderPlacedStamps();
    if (placedResize) syncSelectionControls();
  });

  document.addEventListener('pointerup', e => {
    if (placedDrag && placedDrag.id === e.pointerId) {
      placedDrag = null;
      renderStampList();
      updateButtons();
    }
    if (placedResize && placedResize.id === e.pointerId) {
      placedResize = null;
      renderStampList();
      updateButtons();
    }
  });

  els.ghost.addEventListener('pointerdown', e => {
    if (!ghost || e.target === els.resizeHandle) return;
    dragMode = {
      type: 'move',
      id: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      x: ghost.x,
      y: ghost.y
    };
    els.ghost.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  els.resizeHandle.addEventListener('pointerdown', e => {
    if (!ghost) return;
    dragMode = {
      type: 'resize',
      id: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      width: ghost.width,
      height: ghost.height
    };
    els.ghost.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  els.ghost.addEventListener('pointermove', e => {
    if (!dragMode || dragMode.id !== e.pointerId || !ghost) return;
    const dx = e.clientX - dragMode.startX;
    const dy = e.clientY - dragMode.startY;
    if (dragMode.type === 'move') {
      ghost.x = dragMode.x + dx;
      ghost.y = dragMode.y + dy;
    } else {
      const aspect = dragMode.width / dragMode.height;
      const next = Math.max(30, Math.min(500, dragMode.width + dx));
      ghost.width = next;
      ghost.height = next / aspect;
      const displaySize = Math.round(Math.max(ghost.width, ghost.height));
      els.sizeSlider.value = displaySize;
      els.sizeVal.textContent = displaySize + 'px';
    }
    clampGhost();
    renderGhost();
  });

  els.ghost.addEventListener('pointerup', endGhostDrag);
  els.ghost.addEventListener('pointercancel', endGhostDrag);
}

function endGhostDrag(e) {
  if (dragMode && dragMode.id === e.pointerId) dragMode = null;

// 이미지 문서 페이지는 긴 변을 A4 긴 변(842pt)에 맞춘다. 원본 해상도는 그대로 유지된다.
const IMAGE_PAGE_LONG_SIDE = 842;
const ENHANCE_MODES = { original: '원본', scan: '스캔처럼', bw: '흑백 스캔' };
const DEFAULT_ENHANCE_MODE = 'scan';

// 각 페이지가 어디서 왔는지 기억해 두고, 보정을 바꾸면 이 목록으로 문서를 다시 만든다.
// { kind: 'pdf', file, index } | { kind: 'image', file, mode }
let pageSources = [];
const pdfSourceCache = new WeakMap();
const jpegCache = new WeakMap();

async function openDocumentFiles(files, { replace = false } = {}) {
  const docs = files.filter(f => isPdf(f) || isImage(f))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!docs.length) {
    snack('PDF 또는 이미지 파일만 사용할 수 있습니다.');
    return;
  }
  const append = !replace && !!pdfDoc && docs.every(isImage);
  try {
    let bytes;
    let sources;
    if (!append && docs.length === 1 && isPdf(docs[0])) {
      bytes = await docs[0].arrayBuffer();
    } else {
      snack(docs.some(isImage) ? '문서를 보정하는 중...' : '문서를 준비하는 중...');
      sources = (append ? pageSources : []).concat(await sourcesFromFiles(docs));
      bytes = await buildDocumentBytes(sources);
    }
    const name = docs.length === 1 ? docs[0].name : docs[0].name + ' 외 ' + (docs.length - 1) + '개';
    const firstNewPage = append ? totalPages + 1 : 1;
    await openDocumentBytes(bytes, {
      keepStamps: append,
      page: firstNewPage,
      fileName: append ? null : stampedFileName(docs[0].name),
      label: append ? null : name,
    });
    pageSources = sources || Array.from({ length: totalPages }, (_, index) => ({ kind: 'pdf', file: docs[0], index }));
    updateButtons();
    snack(append ? docs.length + '페이지를 추가했습니다.' : '문서를 열었습니다.');
  } catch (err) {
    snack('문서를 열 수 없습니다: ' + err.message);
  }
}

async function sourcesFromFiles(files) {
  const sources = [];
  for (const file of files) {
    if (isPdf(file)) {
      const src = await loadPdfSource(file);
      src.getPageIndices().forEach(index => sources.push({ kind: 'pdf', file, index }));
    } else {
      sources.push({ kind: 'image', file, mode: DEFAULT_ENHANCE_MODE });
    }
  }
  return sources;
}

async function loadPdfSource(file) {
  if (!pdfSourceCache.has(file)) {
    pdfSourceCache.set(file, await PDFLib.PDFDocument.load(await file.arrayBuffer()));
  }
  return pdfSourceCache.get(file);
}

async function buildDocumentBytes(sources) {
  const doc = await PDFLib.PDFDocument.create();
  for (const source of sources) {
    if (source.kind === 'pdf') {
      const [page] = await doc.copyPages(await loadPdfSource(source.file), [source.index]);
      doc.addPage(page);
    } else {
      const { bytes, width, height } = await imageFileToJpeg(source.file, source.mode);
      const img = await doc.embedJpg(bytes);
      const fit = IMAGE_PAGE_LONG_SIDE / Math.max(width, height);
      const pw = width * fit;
      const ph = height * fit;
      doc.addPage([pw, ph]).drawImage(img, { x: 0, y: 0, width: pw, height: ph });
    }
  }
  return (await doc.save()).buffer;
}

async function setPageEnhanceMode(pageNum, mode) {
  const source = pageSources[pageNum - 1];
  if (!source || source.kind !== 'image' || source.mode === mode) return;
  const prevMode = source.mode;
  source.mode = mode;
  els.enhanceSelect.disabled = true;
  try {
    snack('보정하는 중...');
    const bytes = await buildDocumentBytes(pageSources);
    await openDocumentBytes(bytes, { keepStamps: true, page: pageNum });
    snack(pageNum + '페이지: ' + ENHANCE_MODES[mode]);
  } catch (err) {
    source.mode = prevMode;
    snack('보정 실패: ' + err.message);
  } finally {
    els.enhanceSelect.disabled = false;
    updateButtons();
  }
}

// <img>로 디코딩해 EXIF 회전을 반영하고, 투명 영역은 흰색으로 채워 JPEG로 정규화한다.
async function imageFileToJpeg(file, mode) {
  if (!jpegCache.has(file)) jpegCache.set(file, new Map());
  const cache = jpegCache.get(file);
  if (!cache.has(mode)) {
    const img = await loadImageFile(file);
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0);
    if (mode !== 'original') enhanceDocument(c, mode === 'bw');
    cache.set(mode, { bytes: dataUrlToBytes(c.toDataURL('image/jpeg', 0.92)), width: c.width, height: c.height });
  }
  return cache.get(mode);
}

function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error(file.name + ' 이미지를 읽을 수 없습니다.'));
    };
    img.src = url;
  });
}

// 휴대폰으로 찍은 문서 보정: 종이 배경(조명 얼룩 포함)을 추정해 나눠서 하얗게 만들고,
// 검정점·감마로 글씨를 진하게 한다. 컬러 모드에서는 빨간 도장 같은 색이 유지된다.
function enhanceDocument(canvas, grayscale) {
  const W = canvas.width;
  const H = canvas.height;
  const ctx = canvas.getContext('2d');

  // 1) 1/16로 줄인 뒤 주변 최댓값을 취해 글자를 지우고, 살짝 흐려 종이 배경만 남긴다
  const sw = Math.max(1, Math.ceil(W / 16));
  const sh = Math.max(1, Math.ceil(H / 16));
  const small = document.createElement('canvas');
  small.width = sw;
  small.height = sh;
  const sctx = small.getContext('2d');
  sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(canvas, 0, 0, sw, sh);
  const sImg = sctx.getImageData(0, 0, sw, sh);
  let bgSmall = separablePass(sImg.data, sw, sh, 3, Math.max);
  bgSmall = separablePass(bgSmall, sw, sh, 2, null);
  sctx.putImageData(new ImageData(bgSmall, sw, sh), 0, 0);

  const big = document.createElement('canvas');
  big.width = W;
  big.height = H;
  const bctx = big.getContext('2d');
  bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(small, 0, 0, W, H);
  const bg = bctx.getImageData(0, 0, W, H).data;

  // 2) 배경으로 나눠 조명 얼룩 제거 → 레벨 보정
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const black = grayscale ? 0.45 : 0.35;
  const gamma = grayscale ? 1.6 : 1.4;
  const lut = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) {
    const v = Math.max(0, (i / 255 - black) / (1 - black));
    lut[i] = 255 * Math.pow(v, gamma);
  }
  for (let i = 0; i < d.length; i += 4) {
    const r = Math.min(255, d[i] * 255 / Math.max(1, bg[i]));
    const g = Math.min(255, d[i + 1] * 255 / Math.max(1, bg[i + 1]));
    const b = Math.min(255, d[i + 2] * 255 / Math.max(1, bg[i + 2]));
    if (grayscale) {
      const y = lut[Math.round(0.299 * r + 0.587 * g + 0.114 * b)];
      d[i] = d[i + 1] = d[i + 2] = y;
    } else {
      d[i] = lut[Math.round(r)];
      d[i + 1] = lut[Math.round(g)];
      d[i + 2] = lut[Math.round(b)];
    }
  }
  ctx.putImageData(img, 0, 0);
}

// 가로→세로 순으로 반경 radius 안의 값을 합친다. reduce가 없으면 평균(박스 블러).
function separablePass(src, w, h, radius, reduce) {
  const pass = (input, horizontal) => {
    const out = new Uint8ClampedArray(input.length);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        for (let k = 0; k < 3; k++) {
          let acc = 0;
          let n = 0;
          for (let t = -radius; t <= radius; t++) {
            const xx = horizontal ? Math.min(w - 1, Math.max(0, x + t)) : x;
            const yy = horizontal ? y : Math.min(h - 1, Math.max(0, y + t));
            const v = input[(yy * w + xx) * 4 + k];
            acc = reduce ? reduce(acc, v) : acc + v;
            n++;
          }
          out[(y * w + x) * 4 + k] = reduce ? acc : acc / n;
        }
        out[(y * w + x) * 4 + 3] = 255;
      }
    }
    return out;
  };
  return pass(pass(src, true), false);
}

async function openDocumentBytes(bytes, { keepStamps, page, fileName, label }) {
  const nextDoc = await pdfjsLib.getDocument({
    data: bytes.slice(0),
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
    cMapPacked: true,
    standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
  }).promise;
  pdfBytes = bytes;
  pdfDoc = nextDoc;
  if (fileName) pdfFileName = fileName;
  totalPages = pdfDoc.numPages;
  curPage = Math.min(page, totalPages);
  if (!keepStamps) stampsByPage = {};
  selectedStampId = null;
  ghost = null;
  els.ghost.classList.remove('visible');
  await renderPage(curPage);
  renderThumbs();
  document.getElementById('pdf-zone').classList.add('filled');
  if (label) {
    document.getElementById('pdf-zone-txt').textContent = label;
    els.docName.textContent = label;
  }
  els.emptyState.style.display = 'none';
  els.canvasWrap.style.display = 'block';
  updateButtons();
}

async function renderPage(num, scrollPosition) {
  if (!pdfDoc) return;
  const token = ++pageRenderToken;
  const page = await pdfDoc.getPage(num);
  const maxW = els.viewer.clientWidth - 48;
  const maxH = Math.max(els.viewer.clientHeight - 48, 420);
  const base = page.getViewport({ scale: 1 });
  canvasScale = Math.min(maxW / base.width, maxH / base.height, 2.5);
  const vp = page.getViewport({ scale: canvasScale });
  els.pdfCanvas.width = vp.width;
  els.pdfCanvas.height = vp.height;
  await page.render({ canvasContext: pdfCtx, viewport: vp }).promise;
  if (token !== pageRenderToken) return;
  els.pageInfo.textContent = num + ' / ' + totalPages;
  els.prevBtn.disabled = num <= 1;
  els.nextBtn.disabled = num >= totalPages;
  renderPlacedStamps();
  renderStampList();
  updateThumbHighlights();
  updateButtons();
  requestAnimationFrame(() => {
    if (scrollPosition === 'bottom') {
      els.viewer.scrollTop = els.viewer.scrollHeight;
    } else {
      els.viewer.scrollTop = 0;
    }
  });
}

async function goPage(num, scrollPosition) {
  if (!pdfDoc || num < 1 || num > totalPages || num === curPage) return;
  curPage = num;
  selectedStampId = null;
  ghost = null;
  els.ghost.classList.remove('visible');
  await renderPage(curPage, scrollPosition);
}

async function flipByScroll(num, scrollPosition) {
  scrollFlipLock = true;
  await goPage(num, scrollPosition);
  setTimeout(() => { scrollFlipLock = false; }, 350);
}

async function renderThumbs() {
  els.thumbList.innerHTML = '';
  if (!pdfDoc) return;
  for (let i = 1; i <= totalPages; i++) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'page-thumb';
    item.dataset.page = i;
    item.innerHTML = '<canvas></canvas><div class="num">' + i + '페이지</div>';
    item.addEventListener('click', () => goPage(i));
    els.thumbList.appendChild(item);
    renderThumbCanvas(i, item.querySelector('canvas'));
  }
  updateThumbHighlights();
}

async function renderThumbCanvas(pageNum, canvas) {
  const page = await pdfDoc.getPage(pageNum);
  const vp0 = page.getViewport({ scale: 1 });
  const scale = 128 / vp0.width;
  const vp = page.getViewport({ scale });
  canvas.width = vp.width;
  canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
}

function updateThumbHighlights() {
  document.querySelectorAll('.page-thumb').forEach(item => {
    const page = Number(item.dataset.page);
    item.classList.toggle('active', page === curPage);
    item.classList.toggle('has-stamps', getPageStamps(page).length > 0);
  });
}

function loadStampFiles(files) {
  const images = files.filter(isImage);
  if (images.length < files.length) snack('이미지 파일만 도장으로 등록할 수 있습니다.');
  images.forEach(loadStampFile);
}

function loadStampFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    addPreset(ev.target.result);
    currentOrigUrl = ev.target.result;
    document.getElementById('stamp-zone').classList.add('filled');
    document.getElementById('stamp-zone-txt').textContent = file.name;
    els.bgRemoveBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function loadPresets() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(parsed) ? parsed.filter(x => x && x.dataUrl) : [];
  } catch {
    return [];
  }
}

function savePresets() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(presets));
}

function addPreset(dataUrl) {
  const preset = { id: String(Date.now()) + Math.random().toString(16).slice(2), dataUrl };
  presets.unshift(preset);
  savePresets();
  renderPresets();
  selectStamp(dataUrl, preset.id);
  snack('도장 프리셋을 등록했습니다.');
}

function updatePreset(id, dataUrl) {
  const item = presets.find(x => x.id === id);
  if (!item) return;
  item.dataUrl = dataUrl;
  savePresets();
  renderPresets();
}

function removePreset(id) {
  presets = presets.filter(x => x.id !== id);
  if (selectedPresetId === id) selectStamp(null, null);
  savePresets();
  renderPresets();
}

function renderPresets() {
  els.presetList.innerHTML = '';
  if (!presets.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-list';
    empty.textContent = '이미지를 등록하면 여기에 저장됩니다.';
    els.presetList.appendChild(empty);
    return;
  }

  presets.forEach(preset => {
    const item = document.createElement('div');
    item.className = 'preset';
    item.draggable = true;
    item.classList.toggle('selected', preset.id === selectedPresetId);
    item.innerHTML = '<img alt="도장 프리셋"><button class="x" type="button" title="삭제">×</button>';
    item.querySelector('img').src = preset.dataUrl;
    item.addEventListener('click', () => selectStamp(preset.dataUrl, preset.id));
    item.addEventListener('dragstart', e => {
      selectStamp(preset.dataUrl, preset.id);
      e.dataTransfer.setData('application/x-pdf-stamp', preset.dataUrl);
      e.dataTransfer.setData('text/plain', 'stamp');
    });
    item.querySelector('.x').addEventListener('click', e => {
      e.stopPropagation();
      removePreset(preset.id);
    });
    els.presetList.appendChild(item);
  });
}

function selectStamp(dataUrl, presetId) {
  currentStampUrl = dataUrl;
  currentOrigUrl = dataUrl || currentOrigUrl;
  selectedPresetId = presetId;
  if (dataUrl) {
    const img = new Image();
    img.onload = () => { currentStampAspect = img.naturalWidth / img.naturalHeight || 1; };
    img.src = dataUrl;
    els.stampPreview.src = dataUrl;
    els.stampPreview.style.display = 'block';
    els.noStamp.style.display = 'none';
    els.bgRemoveBtn.disabled = false;
  } else {
    currentStampAspect = 1;
    els.stampPreview.removeAttribute('src');
    els.stampPreview.style.display = 'none';
    els.noStamp.style.display = 'block';
    els.bgRemoveBtn.disabled = true;
    els.bgOpts.classList.remove('visible');
  }
  renderPresets();
  updateButtons();
}

function drawDesign() {
  const sc = document.createElement('canvas');
  sc.width = 220;
  sc.height = 220;
  const c = sc.getContext('2d');
  const color = document.getElementById('stamp-color').value;
  const text = document.getElementById('stamp-text').value || '도장';
  c.clearRect(0, 0, sc.width, sc.height);
  c.strokeStyle = color;
  c.fillStyle = color;
  c.textAlign = 'center';
  c.textBaseline = 'middle';

  if (stampShape === 'circle') {
    c.lineWidth = 9;
    c.beginPath();
    c.arc(110, 110, 96, 0, Math.PI * 2);
    c.stroke();
    c.font = 'bold ' + (text.length > 3 ? 42 : 58) + 'px sans-serif';
    c.fillText(text, 110, 110);
  } else if (stampShape === 'rect') {
    c.lineWidth = 9;
    c.strokeRect(18, 18, 184, 184);
    c.lineWidth = 3;
    c.strokeRect(28, 28, 164, 164);
    c.font = 'bold ' + (text.length > 3 ? 40 : 56) + 'px sans-serif';
    c.fillText(text, 110, 110);
  } else {
    c.lineWidth = 4;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      c.beginPath();
      c.moveTo(110 + 82 * Math.cos(a), 110 + 82 * Math.sin(a));
      c.lineTo(110 + 99 * Math.cos(a), 110 + 99 * Math.sin(a));
      c.stroke();
    }
    c.lineWidth = 5;
    c.beginPath();
    c.arc(110, 110, 76, 0, Math.PI * 2);
    c.stroke();
    c.beginPath();
    c.arc(110, 110, 65, 0, Math.PI * 2);
    c.stroke();
    c.font = 'bold ' + (text.length > 3 ? 38 : 52) + 'px sans-serif';
    c.fillText(text, 110, 110);
  }
  return sc.toDataURL('image/png');
}

function sizeToWH(size, aspect) {
  return aspect >= 1 ? { w: size, h: size / aspect } : { w: size * aspect, h: size };
}

function showGhost(x, y) {
  if (!currentStampUrl || !pdfDoc) {
    snack('먼저 도장을 선택해주세요.');
    return;
  }
  const size = Number(els.sizeSlider.value);
  const { w, h } = sizeToWH(size, currentStampAspect);
  ghost = {
    dataUrl: currentStampUrl,
    x,
    y,
    width: w,
    height: h,
    opacity: Number(els.opSlider.value) / 100
  };
  selectedStampId = null;
  clampGhost();
  renderGhost();
  renderPlacedStamps();
  updateButtons();
}

function addStampAtCanvasPoint(dataUrl, canvasX, canvasY) {
  if (!pdfDoc || !dataUrl) return;
  const size = Number(els.sizeSlider.value);
  const { w, h } = sizeToWH(size, currentStampAspect);
  const stamp = {
    id: String(Date.now()) + Math.random().toString(16).slice(2),
    page: curPage,
    dataUrl,
    x: (canvasX - w / 2) / canvasScale,
    y: (canvasY - h / 2) / canvasScale,
    width: w / canvasScale,
    height: h / canvasScale,
    aspectRatio: currentStampAspect,
    opacity: Number(els.opSlider.value) / 100
  };
  clampStampToPage(stamp);
  getPageStamps(curPage).push(stamp);
  selectedStampId = stamp.id;
  renderPlacedStamps();
  renderStampList();
  updateThumbHighlights();
  syncSelectionControls();
  updateButtons();
}

function renderGhost() {
  if (!ghost) {
    els.ghost.classList.remove('visible');
    return;
  }
  els.ghostImg.src = ghost.dataUrl;
  els.ghost.style.left = ghost.x + 'px';
  els.ghost.style.top = ghost.y + 'px';
  els.ghost.style.width = ghost.width + 'px';
  els.ghost.style.height = ghost.height + 'px';
  els.ghost.style.opacity = ghost.opacity;
  els.ghost.classList.add('visible');
}

function clampGhost() {
  if (!ghost) return;
  ghost.width = Math.min(ghost.width, els.pdfCanvas.width);
  ghost.height = Math.min(ghost.height, els.pdfCanvas.height);
  ghost.x = Math.max(0, Math.min(ghost.x, els.pdfCanvas.width - ghost.width));
  ghost.y = Math.max(0, Math.min(ghost.y, els.pdfCanvas.height - ghost.height));
}

function commitGhost() {
  if (!ghost || !pdfDoc) return;
  const stamp = {
    id: String(Date.now()) + Math.random().toString(16).slice(2),
    page: curPage,
    dataUrl: ghost.dataUrl,
    x: ghost.x / canvasScale,
    y: ghost.y / canvasScale,
    width: ghost.width / canvasScale,
    height: ghost.height / canvasScale,
    aspectRatio: ghost.width / ghost.height,
    opacity: ghost.opacity
  };
  getPageStamps(curPage).push(stamp);
  selectedStampId = stamp.id;
  ghost = null;
  els.ghost.classList.remove('visible');
  renderPlacedStamps();
  renderStampList();
  updateThumbHighlights();
  updateButtons();
}

function getSelectedStamp() {
  if (!selectedStampId) return null;
  return getPageStamps(curPage).find(stamp => stamp.id === selectedStampId) || null;
}

function clampStampToPage(stamp) {
  const pageWidth = els.pdfCanvas.width / canvasScale;
  const pageHeight = els.pdfCanvas.height / canvasScale;
  stamp.width = Math.min(stamp.width, pageWidth);
  stamp.height = Math.min(stamp.height, pageHeight);
  stamp.x = Math.max(0, Math.min(stamp.x, pageWidth - stamp.width));
  stamp.y = Math.max(0, Math.min(stamp.y, pageHeight - stamp.height));
}

function syncSelectionControls() {
  const selected = getSelectedStamp();
  if (!selected) return;
  const displaySize = Math.round(Math.max(selected.width, selected.height) * canvasScale);
  const opacity = Math.round(selected.opacity * 100);
  els.sizeSlider.value = Math.max(Number(els.sizeSlider.min), Math.min(Number(els.sizeSlider.max), displaySize));
  els.sizeVal.textContent = Math.round(Number(els.sizeSlider.value)) + 'px';
  els.opSlider.value = Math.max(Number(els.opSlider.min), Math.min(Number(els.opSlider.max), opacity));
  els.opVal.textContent = Math.round(Number(els.opSlider.value)) + '%';
}

function copySelectedStamp() {
  const selected = getSelectedStamp();
  if (!selected) return;
  copiedStamp = {
    dataUrl: selected.dataUrl,
    width: selected.width,
    height: selected.height,
    aspectRatio: selected.aspectRatio || (selected.width / selected.height),
    opacity: selected.opacity,
    x: selected.x,
    y: selected.y
  };
  updateButtons();
  snack('도장을 복사했습니다.');
}

function pasteCopiedStamp() {
  if (!copiedStamp || !pdfDoc) return;
  const offset = 18 / canvasScale;
  const stamp = {
    id: String(Date.now()) + Math.random().toString(16).slice(2),
    page: curPage,
    dataUrl: copiedStamp.dataUrl,
    x: copiedStamp.x + offset,
    y: copiedStamp.y + offset,
    width: copiedStamp.width,
    height: copiedStamp.height,
    aspectRatio: copiedStamp.aspectRatio || (copiedStamp.width / copiedStamp.height),
    opacity: copiedStamp.opacity
  };
  clampStampToPage(stamp);
  getPageStamps(curPage).push(stamp);
  selectedStampId = stamp.id;
  renderPlacedStamps();
  renderStampList();
  updateThumbHighlights();
  syncSelectionControls();
  updateButtons();
}

function getPageStamps(page) {
  if (!stampsByPage[page]) stampsByPage[page] = [];
  return stampsByPage[page];
}

function renderPlacedStamps() {
  els.stampLayer.innerHTML = '';
  getPageStamps(curPage).forEach((stamp, index) => {
    const node = document.createElement('div');
    node.className = 'placed-stamp';
    node.classList.toggle('selected', stamp.id === selectedStampId);
    node.style.left = stamp.x * canvasScale + 'px';
    node.style.top = stamp.y * canvasScale + 'px';
    node.style.width = stamp.width * canvasScale + 'px';
    node.style.height = stamp.height * canvasScale + 'px';
    node.style.opacity = stamp.opacity;
    node.style.zIndex = String(2 + index);
    node.innerHTML = '<img alt="찍힌 도장"><span class="resize-handle"></span>';
    node.querySelector('img').src = stamp.dataUrl;
    node.querySelector('.resize-handle').addEventListener('pointerdown', e => {
      e.stopPropagation();
      selectedStampId = stamp.id;
      placedDrag = null;
      placedResize = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        width: stamp.width,
        height: stamp.height
      };
      node.setPointerCapture(e.pointerId);
      syncSelectionControls();
      renderStampList();
      updateButtons();
      e.preventDefault();
    });
    node.addEventListener('pointerdown', e => {
      if (e.target.closest('.resize-handle')) return;
      e.stopPropagation();
      selectedStampId = stamp.id;
      syncSelectionControls();
      placedDrag = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        x: stamp.x,
        y: stamp.y
      };
      node.setPointerCapture(e.pointerId);
      renderStampList();
      updateButtons();
    });
    node.addEventListener('click', e => {
      e.stopPropagation();
      selectedStampId = stamp.id;
      syncSelectionControls();
      renderPlacedStamps();
      renderStampList();
      updateButtons();
    });
    els.stampLayer.appendChild(node);
  });
}

function renderStampList() {
  els.stampList.innerHTML = '';
  const stamps = getPageStamps(curPage);
  if (!stamps.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-list';
    empty.textContent = '이 페이지에 찍힌 도장이 없습니다.';
    els.stampList.appendChild(empty);
    return;
  }
  stamps.forEach((stamp, index) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'stamp-row';
    row.classList.toggle('selected', stamp.id === selectedStampId);
    row.innerHTML = '<img alt=""><span>' + (index + 1) + '번 도장</span>';
    row.querySelector('img').src = stamp.dataUrl;
    row.addEventListener('click', () => {
      selectedStampId = stamp.id;
      syncSelectionControls();
      renderPlacedStamps();
      renderStampList();
      updateButtons();
    });
    els.stampList.appendChild(row);
  });
}

function deleteSelectedStamp() {
  if (!selectedStampId) return;
  stampsByPage[curPage] = getPageStamps(curPage).filter(stamp => stamp.id !== selectedStampId);
  selectedStampId = null;
  renderPlacedStamps();
  renderStampList();
  updateThumbHighlights();
  updateButtons();
}

els.saveBtn.addEventListener('click', () => runSave(els.saveBtn, async () => {
  const out = await buildStampedPdfBytes();
  downloadBlob(new Blob([out], { type: 'application/pdf' }), pdfFileName);
  snack('PDF 저장 완료');
}));

els.saveJpgBtn.addEventListener('click', () => runSave(els.saveJpgBtn, async () => {
  const blobs = await renderStampedJpegs();
  const base = pdfFileName.replace(/\.pdf$/i, '');
  if (blobs.length === 1) {
    downloadBlob(blobs[0], base + '.jpg');
  } else {
    const zip = new JSZip();
    const digits = String(blobs.length).length;
    blobs.forEach((blob, i) => zip.file(base + '_' + String(i + 1).padStart(digits, '0') + '.jpg', blob));
    downloadBlob(await zip.generateAsync({ type: 'blob' }), base + '.zip');
  }
  snack(blobs.length === 1 ? 'JPG 저장 완료' : 'JPG ' + blobs.length + '장을 ZIP으로 저장했습니다');
}));

async function runSave(btn, task) {
  if (!pdfBytes) return;
  const label = btn.textContent;
  btn.textContent = '저장 중...';
  els.saveBtn.disabled = true;
  els.saveJpgBtn.disabled = true;
  try {
    await task();
  } catch (err) {
    snack('저장 실패: ' + err.message);
  } finally {
    btn.textContent = label;
    updateButtons();
  }
}

async function buildStampedPdfBytes() {
  const { PDFDocument } = PDFLib;
  const doc = await PDFDocument.load(pdfBytes);
  const imageCache = new Map();

  for (const [pageKey, stamps] of Object.entries(stampsByPage)) {
    const pageNum = Number(pageKey);
    const page = doc.getPages()[pageNum - 1];
    if (!page || !stamps.length) continue;
    const { width: pw, height: ph } = page.getSize();
    const pdfPage = await pdfDoc.getPage(pageNum);
    const base = pdfPage.getViewport({ scale: 1 });
    const scaleX = pw / base.width;
    const scaleY = ph / base.height;

    for (const stamp of stamps) {
      let embedded = imageCache.get(stamp.dataUrl);
      if (!embedded) {
        const isJpeg = stamp.dataUrl.startsWith('data:image/jpeg') || stamp.dataUrl.startsWith('data:image/jpg');
        const isPng = stamp.dataUrl.startsWith('data:image/png');
        const embeddableUrl = (isJpeg || isPng) ? stamp.dataUrl : await toPngDataUrl(stamp.dataUrl);
        const bytes = dataUrlToBytes(embeddableUrl);
        embedded = isJpeg ? await doc.embedJpg(bytes) : await doc.embedPng(bytes);
        imageCache.set(stamp.dataUrl, embedded);
      }
      const x = stamp.x * scaleX;
      const y = ph - (stamp.y + stamp.height) * scaleY;
      const width = stamp.width * scaleX;
      const height = stamp.height * scaleY;
      page.drawImage(embedded, { x, y, width, height, opacity: stamp.opacity });
    }
  }
  return doc.save();
}

// PDF로 만든 결과를 페이지별로 그려 JPG로 만든다. 이미지에서 온 페이지는 원본 해상도,
// PDF 페이지는 200dpi로 그린다.
const JPG_EXPORT_DPI = 200;
const JPG_EXPORT_MAX_SIDE = 6000;

async function renderStampedJpegs() {
  const stamped = await pdfjsLib.getDocument({ data: await buildStampedPdfBytes() }).promise;
  const blobs = [];
  for (let i = 1; i <= stamped.numPages; i++) {
    const page = await stamped.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const source = pageSources[i - 1];
    const native = source && source.kind === 'image' && jpegCache.get(source.file)?.get(source.mode);
    let scale = native ? Math.max(native.width, native.height) / Math.max(base.width, base.height) : JPG_EXPORT_DPI / 72;
    scale = Math.min(scale, JPG_EXPORT_MAX_SIDE / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width);
    c.height = Math.round(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    blobs.push(await new Promise(resolve => c.toBlob(resolve, 'image/jpeg', 0.92)));
  }
  stamped.destroy();
  return blobs;
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toPngDataUrl(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('이미지를 PNG로 변환할 수 없습니다.'));
    img.src = dataUrl;
  });
}

function dataUrlToBytes(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
}

function stampedFileName(name) {
  const clean = (name || 'document.pdf').trim();
  return clean.replace(/\.(pdf|jpe?g|png|webp|gif|bmp|heic)$/i, '') + '_stamped.pdf';
}

function removeBackground(dataUrl, tolerance, cb) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    const px = (x, y) => {
      const i = (y * c.width + x) * 4;
      return [d[i], d[i + 1], d[i + 2]];
    };
    const corners = [px(0, 0), px(c.width - 1, 0), px(0, c.height - 1), px(c.width - 1, c.height - 1)];
    const bg = [0, 1, 2].map(i => Math.round(corners.reduce((sum, p) => sum + p[i], 0) / corners.length));
    const visited = new Uint8Array(c.width * c.height);
    const queue = [];
    const enqueue = (x, y) => {
      if (x < 0 || y < 0 || x >= c.width || y >= c.height) return;
      const idx = y * c.width + x;
      if (visited[idx]) return;
      const i = idx * 4;
      const delta = Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]);
      if (delta <= tolerance * 3) {
        visited[idx] = 1;
        queue.push(x, y);
      }
    };
    for (let x = 0; x < c.width; x++) {
      enqueue(x, 0);
      enqueue(x, c.height - 1);
    }
    for (let y = 0; y < c.height; y++) {
      enqueue(0, y);
      enqueue(c.width - 1, y);
    }
    let qi = 0;
    while (qi < queue.length) {
      const x = queue[qi++];
      const y = queue[qi++];
      d[(y * c.width + x) * 4 + 3] = 0;
      enqueue(x + 1, y);
      enqueue(x - 1, y);
      enqueue(x, y + 1);
      enqueue(x, y - 1);
    }
    ctx.putImageData(id, 0, 0);
    cb(c.toDataURL('image/png'));
  };
  img.src = dataUrl;
}

function updateButtons() {
  els.deleteBtn.disabled = !selectedStampId;
  els.copyBtn.disabled = !selectedStampId;
  els.pasteBtn.disabled = !copiedStamp || !pdfDoc;
  // 보정만 하고 도장 없이 저장하는 경우도 있으므로 문서가 열려 있으면 저장할 수 있다
  els.saveBtn.disabled = !pdfDoc;
  els.saveJpgBtn.disabled = !pdfDoc;
  els.prevBtn.disabled = !pdfDoc || curPage <= 1;
  els.nextBtn.disabled = !pdfDoc || curPage >= totalPages;
  els.pageNav.hidden = !pdfDoc || totalPages <= 1;
  const source = pdfDoc && pageSources[curPage - 1];
  els.enhance.hidden = !source || source.kind !== 'image';
  if (source && source.kind === 'image') els.enhanceSelect.value = source.mode;
  els.stampCount.hidden = !pdfDoc;
  els.stampCount.textContent = '도장 ' + getPageStamps(curPage).length + '개';
  els.bgRemoveBtn.disabled = !currentStampUrl;
  document.getElementById('crop-btn').disabled = !currentStampUrl;
}

function eventToCanvasPoint(e) {
  const rect = els.canvasWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  if (x < 0 || y < 0 || x > els.pdfCanvas.width || y > els.pdfCanvas.height) return null;
  return { x, y };
}

function getDraggedStamp(e) {
  return e.dataTransfer.getData('application/x-pdf-stamp');
}

function isPdf(file) {
  return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
}

function isImage(file) {
  return file.type.startsWith('image/');
}

function wirePresetEdit() {
  const btn = document.getElementById('preset-edit-btn');
  btn.addEventListener('click', () => {
    presetEditMode = !presetEditMode;
    btn.classList.toggle('on', presetEditMode);
    btn.textContent = presetEditMode ? '완료' : '편집';
    els.presetList.classList.toggle('editing', presetEditMode);
  });
}

function wireCropModal() {
  const canvas = document.getElementById('crop-canvas');
  document.getElementById('crop-modal-close').addEventListener('click', closeCropModal);
  document.getElementById('crop-cancel-btn').addEventListener('click', closeCropModal);
  document.getElementById('crop-confirm-btn').addEventListener('click', applyCrop);
  document.getElementById('crop-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('crop-modal')) closeCropModal();
  });

  canvas.addEventListener('mousedown', e => {
    const pt = canvasPoint(canvas, e);
    cropStart = pt;
    cropEnd = pt;
    cropDragging = true;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!cropDragging) return;
    const pt = canvasPoint(canvas, e);
    cropEnd = {
      x: Math.max(0, Math.min(pt.x, canvas.width)),
      y: Math.max(0, Math.min(pt.y, canvas.height))
    };
    drawCropCanvas();
  });
  document.addEventListener('mouseup', () => { cropDragging = false; });
}

function canvasPoint(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
}

function openCropModal() {
  if (!currentOrigUrl) return;
  cropStart = null;
  cropEnd = null;
  cropDragging = false;
  const img = new Image();
  img.onload = () => {
    const maxW = Math.min(440, window.innerWidth - 96);
    const maxH = Math.min(360, window.innerHeight - 200);
    const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    const canvas = document.getElementById('crop-canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    cropSrcImg = img;
    drawCropCanvas();
  };
  img.src = currentOrigUrl;
  document.getElementById('crop-modal').style.display = 'flex';
}

function closeCropModal() {
  document.getElementById('crop-modal').style.display = 'none';
  cropStart = null;
  cropEnd = null;
  cropSrcImg = null;
}

function drawCropCanvas() {
  const canvas = document.getElementById('crop-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (cropSrcImg) ctx.drawImage(cropSrcImg, 0, 0, canvas.width, canvas.height);
  if (!cropStart || !cropEnd) return;
  const x = Math.min(cropStart.x, cropEnd.x);
  const y = Math.min(cropStart.y, cropEnd.y);
  const w = Math.abs(cropEnd.x - cropStart.x);
  const h = Math.abs(cropEnd.y - cropStart.y);
  if (w < 2 || h < 2) return;
  ctx.fillStyle = 'rgba(0,0,0,0.48)';
  ctx.fillRect(0, 0, canvas.width, y);
  ctx.fillRect(0, y + h, canvas.width, canvas.height - y - h);
  ctx.fillRect(0, y, x, h);
  ctx.fillRect(x + w, y, canvas.width - x - w, h);
  ctx.strokeStyle = 'rgba(40,120,216,0.9)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 3]);
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.setLineDash([]);
}

function applyCrop() {
  if (!cropStart || !cropEnd || !cropSrcImg) { snack('크롭 영역을 드래그로 선택하세요.'); return; }
  const canvas = document.getElementById('crop-canvas');
  const sx = cropSrcImg.naturalWidth / canvas.width;
  const sy = cropSrcImg.naturalHeight / canvas.height;
  const x = Math.min(cropStart.x, cropEnd.x) * sx;
  const y = Math.min(cropStart.y, cropEnd.y) * sy;
  const w = Math.abs(cropEnd.x - cropStart.x) * sx;
  const h = Math.abs(cropEnd.y - cropStart.y) * sy;
  if (w < 8 || h < 8) { snack('크롭 영역이 너무 작습니다.'); return; }
  const out = document.createElement('canvas');
  out.width = Math.round(w);
  out.height = Math.round(h);
  out.getContext('2d').drawImage(cropSrcImg, x, y, w, h, 0, 0, out.width, out.height);
  const result = out.toDataURL('image/png');
  currentOrigUrl = result;
  if (selectedPresetId) updatePreset(selectedPresetId, result);
  selectStamp(result, selectedPresetId);
  closeCropModal();
  snack('크롭이 적용됐습니다.');
}

function snack(msg) {
  const el = document.getElementById('snack');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(snack.timer);
  snack.timer = setTimeout(() => el.classList.remove('show'), 2600);
}
